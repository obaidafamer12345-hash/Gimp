<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>Epix Jump - Mobile Landscape</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#050814;color:#fff;font-family:"Segoe UI",Tahoma,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#gameWrap{
  position:relative;width:100vw;height:100vh;display:flex;
  align-items:center;justify-content:center;background:#050814;
}
#gameCanvas{
  display:block;width:100vw;height:100vh;object-fit:contain;
  background:#10163b;
}
#hud{
  position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);z-index:20;
  display:flex;gap:18px;align-items:center;justify-content:center;
  padding:8px 16px;border:1px solid #ffffff20;border-radius:14px;
  background:#080c20bb;backdrop-filter:blur(10px);
  font-size:15px;font-weight:800;pointer-events:none;
}
.hudItem{white-space:nowrap}.value{color:#67e8f9}.ready{color:#4ade80}.cool{color:#fb7185}
#controls{
  position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));
  z-index:30;display:flex;justify-content:space-between;
  align-items:flex-end;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right));
  direction:ltr;pointer-events:none;
}
.controlGroup{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.control{
  width:72px;height:72px;border:1px solid #ffffff35;border-radius:22px;
  color:#fff;background:linear-gradient(145deg,#263a6a,#101a38);
  box-shadow:0 8px 20px #0009,inset 0 1px #ffffff25;
  font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;
  padding:0;-webkit-tap-highlight-color:transparent;
}
.control:active,.pressed{transform:scale(.93);background:#31518c}
#jumpBtn,#dashBtn{width:82px;height:82px;border-radius:50%}
#jumpBtn{font-size:34px}#dashBtn{font-size:14px;color:#67e8f9}
#rotateNotice{
  display:none;position:fixed;inset:0;z-index:100;background:#050814;
  align-items:center;justify-content:center;text-align:center;padding:30px;
}
.noticeBox{max-width:420px;padding:25px;border:1px solid #ffffff22;border-radius:22px;background:#111a38;box-shadow:0 20px 60px #000}
.noticeIcon{font-size:55px;margin-bottom:10px}
.noticeBox h2{margin:5px 0 10px}.noticeBox p{color:#cbd5e1;line-height:1.7;margin:0}
#startBtn{margin-top:18px;padding:12px 24px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:800}
@media (orientation:portrait) and (max-width:700px){
  #rotateNotice{display:flex}
}
@media (max-height:500px){
  #hud{font-size:11px;padding:5px 10px;gap:10px}
  .control{width:58px;height:58px;border-radius:17px;font-size:25px}
  #jumpBtn,#dashBtn{width:66px;height:66px}
}
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
</div>

<div id="hud">
  <div class="hudItem">🏆 النقاط <span id="scoreVal" class="value">0</span></div>
  <div class="hudItem">❤️ الأرواح <span id="livesVal" class="value">3</span></div>
  <div class="hudItem">⚡ Dash <span id="dashVal" class="ready">جاهز</span></div>
</div>

<!-- اليسار: رجوع للخلف ← ثم تقدم للأمام → -->
<div id="controls">
  <div class="controlGroup">
    <button class="control" id="backBtn" aria-label="الرجوع للخلف">◀</button>
    <button class="control" id="forwardBtn" aria-label="التقدم للأمام">▶</button>
  </div>

  <!-- اليمين: قفز واندفاع -->
  <div class="controlGroup">
    <button class="control" id="jumpBtn" aria-label="القفز">⬆</button>
    <button class="control" id="dashBtn" aria-label="الاندفاع">DASH</button>
  </div>
</div>

<div id="rotateNotice">
  <div class="noticeBox">
    <div class="noticeIcon">📱↔️</div>
    <h2>ضع الهاتف بشكل أفقي</h2>
    <p>هذه اللعبة مصممة للعب بالعرض. أدر هاتفك إلى الوضع الأفقي لتحصل على مساحة لعب أكبر.</p>
    <button id="startBtn">حاول ملء الشاشة</button>
  </div>
</div>

<script>
const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d");
const scoreVal=document.getElementById("scoreVal"),livesVal=document.getElementById("livesVal"),dashVal=document.getElementById("dashVal");
const W=1280,H=720;
const keys={};let score=0,lives=3,cameraX=0,shake=0,time=0;

const AC=window.AudioContext||window.webkitAudioContext;
const audioCtx=AC?new AC():null;
function sound(t){
 if(!audioCtx)return;
 if(audioCtx.state==="suspended")audioCtx.resume();
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;
 const c={jump:[220,520,.12,"sine"],coin:[550,900,.16,"triangle"],dash:[300,90,.2,"sawtooth"],hit:[110,45,.25,"square"]}[t];
 if(!c)return;
 o.type=c[3];o.frequency.setValueAtTime(c[0],n);o.frequency.exponentialRampToValueAtTime(c[1],n+c[2]);
 g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.01,n+c[2]);
 o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+c[2]);
}

const player={
 x:100,y:500,w:44,h:64,vx:0,vy:0,speed:6,jump:-14,gravity:.58,
 grounded:false,dashCD:0,dashing:false,dashT:0,dashDir:1,inv:0
};

const platforms=[
{x:0,y:590,w:1550,h:130},{x:430,y:445,w:230,h:25},{x:790,y:335,w:250,h:25},
{x:1120,y:445,w:200,h:25},{x:1450,y:370,w:270,h:25},
{x:1900,y:590,w:1800,h:130},{x:2180,y:440,w:210,h:25},
{x:2550,y:315,w:230,h:25},{x:2920,y:415,w:240,h:25},
{x:3300,y:330,w:260,h:25}
];

let coins=[490,900,1180,1550,2260,2630,3010,3400].map((x,i)=>({
 x,y:[395,280,380,310,385,260,360,275][i],r:14,taken:false
}));

const enemyStart=()=>[
{x:530,y:381,w:44,h:64,vx:2,min:450,max:620},
{x:1170,y:381,w:44,h:64,vx:-2,min:1120,max:1280},
{x:2020,y:526,w:44,h:64,vx:2.8,min:1950,max:2150},
{x:2960,y:351,w:44,h:64,vx:2,min:2920,max:3110}
];
let enemies=enemyStart(),particles=[];

function burst(x,y,c,n=16){
 for(let i=0;i<n;i++)particles.push({
  x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,
  r:2+Math.random()*5,life:25+Math.random()*20,c
 });
}
function resetPlayer(){
 player.x=100;player.y=500;player.vx=0;player.vy=0;
 player.dashing=false;player.inv=50;
}
function gameOver(){
 alert("انتهت اللعبة! حاول مرة أخرى.");
 score=0;lives=3;coins.forEach(c=>c.taken=false);
 enemies=enemyStart();resetPlayer();
}
function jump(){
 if(player.grounded&&!player.dashing){
  player.vy=player.jump;player.grounded=false;sound("jump");
  burst(player.x+22,player.y+62,"#bff6ff",9);
 }
}
function dash(){
 if(player.dashCD<=0&&!player.dashing){
  player.dashing=true;player.dashT=14;player.dashCD=65;
  player.dashDir=(keys.ArrowLeft||keys.KeyA)?-1:((keys.ArrowRight||keys.KeyD)?1:player.dashDir);
  sound("dash");shake=9;
 }
}

window.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
 if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")jump();
 if(e.code==="ShiftLeft"||e.code==="ShiftRight")dash();
});
window.addEventListener("keyup",e=>keys[e.code]=false);

function bindHold(id,key){
 const b=document.getElementById(id);
 const down=e=>{e.preventDefault();b.classList.add("pressed");keys[key]=true};
 const up=e=>{e.preventDefault();b.classList.remove("pressed");keys[key]=false};
 ["touchstart","mousedown"].forEach(v=>b.addEventListener(v,down,{passive:false}));
 ["touchend","touchcancel","mouseup","mouseleave"].forEach(v=>b.addEventListener(v,up,{passive:false}));
}
function bindAction(id,action){
 const b=document.getElementById(id);
 const fn=e=>{e.preventDefault();b.classList.add("pressed");action();setTimeout(()=>b.classList.remove("pressed"),100)};
 ["touchstart","mousedown"].forEach(v=>b.addEventListener(v,fn,{passive:false}));
}
bindHold("backBtn","ArrowLeft");
bindHold("forwardBtn","ArrowRight");
bindAction("jumpBtn",jump);
bindAction("dashBtn",dash);

document.getElementById("startBtn").addEventListener("click",async()=>{
 try{
  if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
  if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("landscape");
 }catch(e){}
});

async function tryLandscape(){
 try{
  if(screen.orientation&&screen.orientation.type.startsWith("portrait")&&screen.orientation.lock)
   await screen.orientation.lock("landscape");
 }catch(e){}
}
tryLandscape();

function update(){
 time++;
 if(player.dashCD>0)player.dashCD--;
 if(player.inv>0)player.inv--;

 if(player.dashing){
  player.vx=player.dashDir*18;player.vy=0;player.dashT--;
  if(player.dashT<=0)player.dashing=false;
 }else{
  if(keys.ArrowRight||keys.KeyD){player.vx=player.speed;player.dashDir=1}
  else if(keys.ArrowLeft||keys.KeyA){player.vx=-player.speed;player.dashDir=-1}
  else player.vx*=.72;
  player.vy+=player.gravity;
 }

 const oldY=player.y;
 player.x+=player.vx;player.y+=player.vy;player.grounded=false;

 platforms.forEach(p=>{
  if(player.x+player.w>p.x&&player.x<p.x+p.w&&
     oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){
   player.y=p.y-player.h;player.vy=0;player.grounded=true;
  }
 });

 player.x=Math.max(-30,player.x);

 enemies.forEach(e=>{
  e.x+=e.vx;
  if(e.x<e.min||e.x>e.max)e.vx*=-1;
 });

 enemies.slice().forEach(e=>{
  const hit=player.x+player.w>e.x&&player.x<e.x+e.w&&
            player.y+player.h>e.y&&player.y<e.y+e.h&&player.inv<=0;
  if(!hit)return;

  if(player.dashing){
   enemies=enemies.filter(a=>a!==e);score+=100;sound("coin");
   burst(e.x+22,e.y+30,"#67e8f9",20);
  }else if(player.vy>0&&oldY+player.h<=e.y+14){
   enemies=enemies.filter(a=>a!==e);player.vy=-10;score+=50;sound("coin");
   burst(e.x+22,e.y+20,"#fb7185",20);
  }else{
   lives--;sound("hit");shake=15;resetPlayer();
   if(lives<=0)gameOver();
  }
 });

 coins.forEach(c=>{
  if(!c.taken&&player.x+player.w>c.x-c.r&&player.x<c.x+c.r&&
     player.y+player.h>c.y-c.r&&player.y<c.y+c.r){
   c.taken=true;score+=20;sound("coin");burst(c.x,c.y,"#facc15",18);
  }
 });

 if(player.y>H+120){
  lives--;sound("hit");shake=15;resetPlayer();
  if(lives<=0)gameOver();
 }

 cameraX=Math.max(0,Math.min(3000,player.x-400));

 particles.forEach((p,i)=>{
  p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life--;
  if(p.life<=0)particles.splice(i,1);
 });

 scoreVal.textContent=score;livesVal.textContent=lives;
 dashVal.textContent=player.dashCD<=0?"جاهز":Math.ceil(player.dashCD/10);
 dashVal.className=player.dashCD<=0?"ready":"cool";
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}

function drawPlayer(){
 const x=player.x,y=player.y;
 ctx.save();
 if(player.inv%6<3)ctx.globalAlpha=.5;

 ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(x+22,y+66,26,6,0,0,Math.PI*2);ctx.fill();

 if(player.dashing){
  for(let i=1;i<6;i++){
   ctx.globalAlpha=.1;ctx.fillStyle="#67e8f9";
   rr(x-player.dashDir*i*22,y+8,42,52,13);
  }
  ctx.globalAlpha=1;
 }

 ctx.fillStyle="#172554";rr(x+6,y+43,13,21,5);rr(x+25,y+43,13,21,5);

 const body=ctx.createLinearGradient(x,y,x+44,y+64);
 body.addColorStop(0,"#67e8f9");body.addColorStop(1,"#2563eb");
 ctx.fillStyle=body;rr(x+4,y+22,36,30,11);

 ctx.fillStyle="#e0f2fe";ctx.fillRect(x+7,y+37,30,5);

 ctx.fillStyle="#ffd7b5";ctx.beginPath();ctx.arc(x+22,y+15,15,0,Math.PI*2);ctx.fill();

 ctx.fillStyle="#0f172a";ctx.beginPath();ctx.arc(x+22,y+13,15,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(x+7,y+10,30,8);

 ctx.fillStyle="#111827";rr(x+10,y+12,24,9,4);
 ctx.fillStyle="#67e8f9";ctx.fillRect(x+13,y+14,18,3);

 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+22,y+30,6,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#2563eb";ctx.font="bold 9px Arial";ctx.textAlign="center";ctx.fillText("E",x+22,y+33);

 ctx.restore();
}

function draw(){
 ctx.save();

 if(shake){
  ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);shake--;
 }

 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#070b2b");sky.addColorStop(.55,"#17245c");sky.addColorStop(1,"#312e81");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 for(let i=0;i<60;i++){
  const sx=((i*151-cameraX*.12)%(W+120)+W+120)%(W+120)-60;
  const sy=(i*79)%390;
  ctx.fillStyle=i%5===0?"#fff":"#ffffff80";ctx.fillRect(sx,sy,2,2);
 }

 for(let i=0;i<22;i++){
  const bx=((i*190-cameraX*.24)%(W+220)+W+220)%(W+220)-100;
  const bh=70+(i*41)%160;
  ctx.fillStyle="#0a1033";ctx.fillRect(bx,H-130-bh,115,bh);
 }

 ctx.save();ctx.translate(-cameraX,0);

 platforms.forEach(p=>{
  const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
  g.addColorStop(0,p.h>30?"#334155":"#64748b");
  g.addColorStop(1,"#1e293b");
  ctx.fillStyle=g;rr(p.x,p.y,p.w,p.h,p.h>30?14:8);
  ctx.fillStyle="#a5b4fc";ctx.fillRect(p.x,p.y,p.w,4);
 });

 coins.forEach(c=>{
  if(!c.taken){
   ctx.save();ctx.translate(c.x,c.y);
   ctx.rotate(Math.sin(time*.08+c.x)*.2);
   ctx.fillStyle="#facc15";ctx.beginPath();
   ctx.ellipse(0,0,c.r*.72,c.r,0,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle="#fde68a";ctx.lineWidth=2;ctx.stroke();
   ctx.fillStyle="#a16207";ctx.font="bold 14px Arial";ctx.textAlign="center";ctx.fillText("★",0,5);
   ctx.restore();
  }
 });

 enemies.forEach(e=>{
  ctx.fillStyle="#7f1d1d";rr(e.x,e.y,e.w,e.h,12);
  ctx.fillStyle="#ef4444";rr(e.x+5,e.y+6,e.w-10,e.h-11,9);
  ctx.fillStyle="#fff";ctx.fillRect(e.x+9,e.y+16,7,7);ctx.fillRect(e.x+28,e.y+16,7,7);
  ctx.fillStyle="#111827";ctx.fillRect(e.x+12,e.y+37,20,4);
 });

 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.c;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
 });

 drawPlayer();

 ctx.restore();

 ctx.fillStyle="#ffffff22";rr(25,H-28,W-50,6,3);
 ctx.fillStyle="#67e8f9";rr(25,H-28,Math.min(W-50,(player.x/3500)*(W-50)),6,3);

 ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
